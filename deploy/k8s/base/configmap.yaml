apiVersion: v1
kind: ConfigMap
metadata:
  name: macfleet-config
data:
  HTTP_ADDR: ":8080"
  AGENT_ADDR: ":8443"
  # DNS names or IPs agents connect to, baked into the agent-facing server certificate.
  AGENT_HOSTS: "REPLACE_WITH_AGENT_LB_IP_OR_DNS"
  # What the enrollment command tells agents to use.
  PUBLIC_AGENT_URL: "https://REPLACE_WITH_AGENT_LB_IP_OR_DNS:8443"
  RAW_RETENTION_DAYS: "2"
  RETENTION_DAYS: "30"
  AGENT_CERT_DAYS: "90"
