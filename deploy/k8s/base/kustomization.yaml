apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: macfleet
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - postgres.yaml
  - server.yaml
  - ingress.yaml
  - backup.yaml
  - networkpolicy.yaml
images:
  - name: macfleet-server
    newName: REGION-docker.pkg.dev/PROJECT_ID/macfleet/macfleet-server
    newTag: latest
