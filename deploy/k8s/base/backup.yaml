apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: macfleet-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: macfleet
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: dump
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: macfleet-secrets
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  f=/backups/macfleet-$(date +%Y%m%d).sql.gz
                  pg_dump -h postgres -U macfleet -d macfleet --exclude-table-data='metrics_*' | gzip > "$f"
                  # keep the last 7 dumps
                  ls -1t /backups/macfleet-*.sql.gz | tail -n +8 | xargs -r rm --
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: macfleet-backups
